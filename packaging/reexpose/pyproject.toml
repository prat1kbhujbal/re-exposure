[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reexpose"
version = "0.1.0"
description = "Score how exposed a binary is to AI-assisted reverse engineering"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Pratik Bhujbal" }]
keywords = ["reverse-engineering", "binary-analysis", "appsec", "llm", "hardening"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/prat1kbhujbal/ren"

[project.scripts]
reexpose = "reexpose:main"

[tool.setuptools]
py-modules = ["reexpose"]
